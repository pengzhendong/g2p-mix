name: ruff

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"
