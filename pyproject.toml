[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2p-mix"
authors = [{ name = "Zhendong Peng", email = "pzd17@tsinghua.org.cn" }]
description = "Mixed Mandarin/Cantonese and English grapheme-to-phoneme conversion"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "click",
  "g2p-en",
  "jieba",
  "nltk",
  "pycantonese",
  "pyopenhc",
  "pypinyin",
  "ToJyutping>=3.2",
  "wordsegment",
]

[project.optional-dependencies]
g2pw = ["torch", "modelscope", "g2pw>=0.1.1"]
similarity = ["panphon>=0.22.2,<0.23"]
test = [
  "build>=1.2.1,<1.4",
  "pip>=23.1,<26",
  "pytest>=8",
  "setuptools>=77,<81",
  "wheel>=0.45,<0.47",
]
dev = [
  "build>=1.2.1,<1.4",
  "pip>=23.1,<26",
  "pytest>=8",
  "ruff==0.16.0",
  "setuptools>=77,<81",
  "wheel>=0.45,<0.47",
]

[project.scripts]
g2p_mix = "g2p_mix.cli:main"

[project.urls]
Homepage = "https://github.com/pengzhendong/g2p-mix"
Documentation = "https://github.com/pengzhendong/g2p-mix#readme"
BugTracker = "https://github.com/pengzhendong/g2p-mix/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not g2pw'"
markers = ["g2pw: requires optional G2PW dependencies, model download, and network access"]

[tool.ruff]
line-length = 120
target-version = "py310"
required-version = "==0.16.0"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["g2p_mix*"]

[tool.setuptools.package-data]
g2p_mix = [
  "py.typed",
  "dict/*.json",
  "dict/*.txt",
  "nltk_data/corpora/*.zip",
  "nltk_data/taggers/*.zip",
  "nltk_data/taggers/*/*.json",
]

[tool.setuptools.data-files]
"share/doc/g2p-mix" = ["THIRD_PARTY_NOTICES.md"]
"share/g2p-mix/tests/cases" = ["tests/cases/*.json"]
"share/g2p-mix/tests/fixtures/third_party" = ["tests/fixtures/third_party/manifest.json"]
"share/g2p-mix/tests/fixtures/third_party/cc_cedict" = ["tests/fixtures/third_party/cc_cedict/*"]
"share/g2p-mix/tests/fixtures/third_party/cmudict" = ["tests/fixtures/third_party/cmudict/*"]
"share/g2p-mix/tests/fixtures/third_party/g2pw_readme" = ["tests/fixtures/third_party/g2pw_readme/*"]
"share/g2p-mix/tests/fixtures/third_party/hkcancor" = ["tests/fixtures/third_party/hkcancor/*"]
