[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2p-mix"
authors = [{ name = "Zhendong Peng", email = "pzd17@tsinghua.org.cn" }]
description = "Mixed Mandarin/Cantonese and English grapheme-to-phoneme conversion"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "click",
  "g2p-en",
  "jieba",
  "nltk",
  "pycantonese",
  "pyopenhc",
  "pypinyin",
  "setuptools<81; python_version < '3.10'", # wordseg and jieba still import pkg_resources on Python 3.9
  "ToJyutping>=3.2",
  "wordsegment",
]

[project.optional-dependencies]
g2pw = ["torch", "modelscope", "g2pw>=0.1.1"]
test = ["pytest>=8"]
dev = ["build", "pytest>=8", "ruff==0.16.0"]

[project.scripts]
g2p_mix = "g2p_mix.cli:main"

[project.urls]
Homepage = "https://github.com/pengzhendong/g2p-mix"
Documentation = "https://github.com/pengzhendong/g2p-mix#readme"
BugTracker = "https://github.com/pengzhendong/g2p-mix/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["g2pw: requires optional G2PW dependencies, model download, and network access"]

[tool.ruff]
line-length = 120
target-version = "py39"
required-version = "==0.16.0"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["g2p_mix*"]

[tool.setuptools.package-data]
g2p_mix = [
  "py.typed",
  "dict/*.json",
  "dict/*.txt",
  "nltk_data/corpora/*.zip",
  "nltk_data/taggers/*.zip",
  "nltk_data/taggers/*/*.json",
]
